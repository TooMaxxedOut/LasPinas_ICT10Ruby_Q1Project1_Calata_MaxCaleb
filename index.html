<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILEOS2_SKUgen</title>
    <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PyScript 2026.7.3 CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    
    <!-- PyScript 2026.7.3 Core JavaScript -->
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
    <style>
        @import url('https://fonts.cdnfonts.com/css/vcr-osd-mono');
        body { font-family: 'VCR OSD Mono', sans-serif;
        background-image: url('SMILEOSbg.png');
        padding: 20px;
        }
        h2{
            color:rgb(255, 255, 255)
        }
        .container{
            background-color: rgba(31, 31, 31, 0.726);
            padding: 15px;
            margin-bottom: 20px;
            
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1)
        }
        label {
            color:rgb(255, 255, 255);
            display: block;
            font-weight: bold;
             font-size: 18px;
        }
        button {
            display: block;
            width: 50%;
            padding: 12px;
            background-color: #eb4343;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'VCR OSD Mono', sans-serif;
            font-size: 24px;
 
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        button:hover {
            background-color: #f30606;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.20);
        }

        #sku_output {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            text-align: center;
            font-family: "VCR OSD Mono";
            font-size: 16px;
        }

        .product-icon {
            text-align: center;
            margin-bottom: 15px;
        }

        .product-icon img {
            width: 160px;
            height: 40px;
            object-fit: contain;
        }
    </style>
</head>
<body>
         <div class="container">
            <h2> SmileOS 2.0 Devtools</h2>
              <h4> P.S: Very minimal, the Terminals are mostly automated and we only added a way to manually add "products" for the investors.</h4> 
              <p> p.s. REMOVE ALL THE P.S. STATEMENTS BEFORE WE START SHIPPING THESE OUT TO THE #### ###########</p>
            <label for="category">Product Category</label>

            <select id="category">
                    <option value="default">Choose One</option>
                    <option value="prize">Weapons</option>
                    <option value="info">Enemy Entry</option>
                    <option value="repair">Dynamic Repairs</option>
                    <option value="evil">gabriel bodypillow (evil option)</option>
            </select>
<br><br>
            <label for="product_name">Product Name</label>
            <input type="text" id="product_name" placeholder="Enter product name">
<br><br>
            <label for="quantity">Stock Quantity</label>
            <input type="number" id="quantity" placeholder="Enter stock quantity">
<br><br><br>
<center>
<button py-click="generateSKU">
    Generate SKU
</button><br>
<nav>
<a href="reciept.html">Receipt Printer</a>
</nav>

<py-script src="main.py"></py-script>
</center>
<br>
<div id="sku_output"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    
</body>
</html>
